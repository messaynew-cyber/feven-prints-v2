name: Deploy to Cloudflare Pages

# Why this exists instead of Cloudflare's own Git integration: connecting the
# repo in the Cloudflare dashboard loops (GitHub reports success, Cloudflare
# never registers the installation — error 8000011). Deploying from GitHub
# Actions gives the same outcome — push to main, site updates — with no OAuth
# dance and no vendor lock on the repo connection.
#
# Requires two repository secrets:
#   CLOUDFLARE_API_TOKEN  — scoped to this account (Pages:Edit)
#   CLOUDFLARE_ACCOUNT_ID — fad74f3967eb7954911fb2518f990b53

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy . --project-name=norcha-print
