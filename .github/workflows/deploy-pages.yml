name: Deploy to Cloudflare Pages

# Why GitHub Actions instead of Cloudflare's own Git integration: connecting the
# repo in the Cloudflare dashboard loops (GitHub reports success, Cloudflare
# never registers the installation - error 8000011). Deploying from Actions
# gives the same outcome - push to main, site updates - with no OAuth dance.
#
# Requires two repository secrets:
#   CLOUDFLARE_API_TOKEN  - scoped to this account (Pages:Edit)
#   CLOUDFLARE_ACCOUNT_ID - fad74f3967eb7954911fb2518f990b53

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4

      # Stage only what a visitor should be able to fetch. DESIGN.md and
      # styleguide.html are internal working documents and are NOT for the
      # public web; deploying the repo root published them by accident.
      - name: Stage public files
        run: |
          mkdir -p dist
          rsync -a --exclude '.git' --exclude '.github' --exclude 'DESIGN.md' \
                --exclude 'styleguide.html' --exclude '*.md' --exclude '.gitignore' \
                --exclude 'node_modules' --exclude 'package.json' \
                --exclude 'package-lock.json' --exclude 'build-pages.js' \
                --exclude 'domtest.js' --exclude 'livetest.js' --exclude 'pagetest.js' \
                --exclude 'uploadtest.mjs' --exclude 'build-images.sh' \
                ./ dist/

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=norcha-print
